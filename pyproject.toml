[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "cited-docs-qa"
version = "0.1.0"
description = "Cited document Q&A service (RAG) with hybrid retrieval and refusal"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3.6",
    "sentence-transformers>=3.3",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "httpx>=0.27",
    "tiktoken>=0.8",
    "python-multipart>=0.0.12",
    "anthropic>=0.40",
    "openai>=1.57",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
